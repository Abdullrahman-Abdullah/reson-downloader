name: reson_downloader
description: "A multi-threaded download manager built with Flutter and Dio."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.0.0
  file_picker: 13.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.0.0 
  firebase_remote_config: ^5.0.0
  cloud_firestore: ^5.6.12
  url_launcher: ^6.3.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#181824"
  adaptive_icon_foreground: "assets/images/icon.png"

